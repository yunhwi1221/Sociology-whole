name: Keep Supabase Awake

# Supabase 무료 플랜은 7일간 API 요청이 없으면 프로젝트를 자동으로
# 일시정지(pause)한다. 매일 REST API에 가벼운 요청을 보내 "활동"으로
# 인식시켜서 자동 일시정지를 막는다.
on:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00 UTC (한국시간 12:00)
  workflow_dispatch: {} # 필요할 때 수동으로도 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # 아래 URL과 apikey는 supabase-config.js와 동일한 "공개용(publishable) 키"다.
        # 브라우저 노출을 전제로 설계된 키라 워크플로우에 그대로 적어도 안전하며,
        # 별도 GitHub Secrets 설정 없이 바로 동작한다.
        # profiles는 RLS로 막혀 있어 결과는 항상 빈 배열이지만, 그래도 API에
        # 실제 요청이 들어간 것으로 집계되어 자동 일시정지를 막기엔 충분하다.
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://nmdymclyzceayufspkus.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_ewPNrSkIym4gIpIyUUsFJw_l1PySPTq" \
            -H "Authorization: Bearer sb_publishable_ewPNrSkIym4gIpIyUUsFJw_l1PySPTq")
          echo "Supabase REST API responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::error::Supabase가 응답하지 않습니다 (HTTP $status)"
            exit 1
          fi
